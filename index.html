    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // La pagina si vede prima di rispondere ai tocchi: si ricorda l'ultimo bottone toccato nel frattempo
      // e lo si preme appena è pronta (src/App.tsx chiama __paginaViva).
      (function () {
        var ultimo = null;
        function ricorda(e) {
          var b = e.target && e.target.closest ? e.target.closest('button:not([type="submit"]), [role="button"]') : null;
          if (b) ultimo = b;
        }
        addEventListener("click", ricorda, true);
        window.__paginaViva = function () {
          removeEventListener("click", ricorda, true);
          if (ultimo && ultimo.isConnected) ultimo.click();
          ultimo = null;
        };
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Make sure animations still work if JS fails -->
    <noscript>
      <style>
        .reveal { opacity: 1 !important; transform: none !important; }
        [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
